  <defs>
    <style>
      .ink-black { fill: #111111; }
      .warning-red { fill: #F13B32; }
    </style>
  </defs>
  
  <g transform="translate(0, 10)">
    <!-- [ Bracket -->
    <path class="ink-black" d="M 20,0 L 35,0 L 35,10 L 20,10 L 20,70 L 35,70 L 35,80 L 10,80 L 10,0 Z" />
    
    <!-- v -->
