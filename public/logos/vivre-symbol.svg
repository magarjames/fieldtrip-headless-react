    <!-- ] Bracket -->
    <path class="ink-black" d="M 110,0 L 95,0 L 95,10 L 110,10 L 110,70 L 95,70 L 95,80 L 120,80 L 120,0 Z" />
    
    <!-- . Red Dot -->
