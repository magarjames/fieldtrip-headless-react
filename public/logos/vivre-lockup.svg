<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 140" width="100%" height="100%">
  <defs>
    <style>
      .brand-blue { fill: #1646DB; }
      .warning-red { fill: #F13B32; stroke: #F13B32; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .subtext { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 7.5px; font-weight: 700; letter-spacing: 0.05em; }
    </style>
  </defs>
  
  <g class="brand-blue" transform="translate(0, 10)">
    <!-- V -->
    <polygon points="0,0 14,0 23,80 15,80" />
    <polygon points="38,0 24,0 15,80 23,80" />
    
    <!-- I -->
    <rect x="46" y="0" width="12" height="80" />
    
    <!-- V -->
    <polygon points="66,0 80,0 89,80 81,80" />
    <polygon points="104,0 90,0 81,80 89,80" />
    
    <!-- R -->
    <rect x="112" y="0" width="12" height="80" />
    <!-- R Loop -->
    <path d="M 124,0 L 140,0 C 150,0 150,5 150,22 C 150,39 150,44 140,44 L 124,44 Z M 124,12 L 136,12 C 138,12 138,15 138,22 C 138,29 138,32 136,32 L 124,32 Z" fill-rule="evenodd" />
    <!-- R Leg -->
    <polygon points="124,44 140,44 152,80 136,80" />
    
    <!-- E -->
    <rect x="160" y="0" width="12" height="80" />
    <rect x="172" y="0" width="22" height="12" />
    <rect x="172" y="34" width="18" height="12" />
    <rect x="172" y="68" width="24" height="12" />
  </g>

  <!-- Lockup Text -->
  <text x="105" y="112" class="brand-blue subtext" text-anchor="middle">THE LIVING ARCHIVE</text>
  <text x="105" y="125" class="brand-blue subtext" text-anchor="middle">DRESS LIKE YOU HAVE SOMEWHERE TO BE.</text>
  
  <!-- Red Accent Arrow -->
  <path d="M 188 125 L 191 119 L 194 125" class="warning-red" fill="none" />
</svg>
